name: qwen_phone_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_markdown_plus: ^1.0.12
  record: ^7.1.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/telo_icon_1.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/telo_icon_1.png"
  min_sdk_android: 21